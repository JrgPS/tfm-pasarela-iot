global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    timeout connect 5s
    timeout client 150s
    timeout server 150s

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s

frontend devices
    mode tcp
    bind :7443
    default_backend gateways

backend gateways
    mode tcp
    balance leastconn
    option httpchk
    http-check connect port 8081
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    server-template gw 1-8 gateway:7443 check inter 2s fall 2 rise 1 resolvers docker init-addr none

frontend registry_internal
    mode http
    bind :8080
    default_backend registries

backend registries
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    server-template reg 1-8 registry:8080 check inter 2s fall 2 rise 1 resolvers docker init-addr none
