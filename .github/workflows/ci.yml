name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iot_tests
          POSTGRES_USER: iot_tests
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot_tests -d iot_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore IotGateway.slnx
      - run: dotnet build IotGateway.slnx -c Release --no-restore
      - run: dotnet test IotGateway.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
        env:
          IOT_TEST_CONNECTION: Host=localhost;Database=iot_tests;Username=iot_tests;Password=ci-only-not-a-production-secret
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start isolated fictitious demo
        run: sh scripts/start-demo.sh
        env:
          DEVICES: '10'
          GATEWAYS: '1'
          REGISTRIES: '1'
      - name: Prepare test database
        run: docker compose exec -T db createdb -U iot iot_tests
      - name: Protocol, PostgreSQL and real TCP TLS tests
        run: docker compose run --rm --build tests
        env:
          IOT_NETWORK_TESTS: 'true'
      - name: Simulator and persisted totals
        run: docker compose run --rm --build simulator --host proxy --devices 10 --operations 5 --output results/ci-smoke.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: docker-evidence
          path: |
            results/tests/*.trx
            results/ci-smoke.json
            results/ci-smoke.csv
      - name: Remove disposable CI project
        if: always()
        run: docker compose down --volumes
